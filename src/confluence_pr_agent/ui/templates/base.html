<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>confluence-pr-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Softer slate-navy, not near-black -- less eye strain than the first pass. */
    --bg: #1b1d2c;
    --bg-elevated: #262838;
    --bg-elevated-2: #2c2e40;
    --border: #3d3f57;
    --text: #e9eaf2;
    --text-muted: #a3a7c5;
    --accent: #e5002b;
    --accent-hover: #ff2249;
    --accent-blue: #5b9ce6;
    --success-bg: rgba(16, 185, 129, 0.18);
    --success-text: #4fe0ac;
    --success-border: rgba(79, 224, 172, 0.4);
    --error-bg: rgba(229, 0, 43, 0.18);
    --error-text: #ff8298;
    --error-border: rgba(255, 130, 152, 0.4);
    --neutral-bg: rgba(163, 167, 197, 0.16);
    --neutral-text: #c5c8e2;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Exo', system-ui, -apple-system, sans-serif;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: var(--text);
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(91, 156, 230, 0.1), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 0%, rgba(229, 0, 43, 0.09), transparent 55%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1.75rem 0 1.25rem;
  }
  .brand-mark { flex-shrink: 0; }
  .brand-name {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .brand-name .dim { color: var(--text-muted); font-weight: 500; }

  nav {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2.25rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }
  nav a {
    text-decoration: none;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.9rem;
    padding: 0.7rem 0.9rem;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease;
  }
  nav a:hover { color: var(--text); }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }

  h1 { margin-bottom: 0.25rem; font-weight: 700; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-muted); margin-top: 0; margin-bottom: 1.75rem; font-size: 0.95rem; line-height: 1.5; }

  fieldset {
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    border-radius: 12px;
    margin-bottom: 1.5rem;
    padding: 1.1rem 1.4rem 1.4rem;
  }
  legend {
    font-weight: 600;
    padding: 0 0.5rem;
    color: var(--text);
    font-size: 0.95rem;
  }

  label { display: block; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

  input, select {
    width: 100%;
    padding: 0.55rem 0.75rem;
    margin-top: 0.35rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 0.9rem;
    font-family: inherit;
  }
  input::placeholder { color: #5a5e82; }
  input:focus, select:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(46, 123, 214, 0.25); }
  /* color-scheme: dark alone makes Chrome render the calendar icon in a
     light color already suited to a dark background -- do NOT also add an
     invert() filter on top of that (that was tried first and flips the
     already-light icon back to dark, recreating the exact camouflage
     problem this is fixing). */
  input[type="date"] { color-scheme: dark; }
  input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
  select { appearance: none; }

  .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem; line-height: 1.4; }
  .set-badge { color: var(--success-text); font-size: 0.75rem; font-weight: 600; margin-left: 0.4rem; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.98); }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--error-border);
    color: var(--error-text);
    padding: 0.35rem 0.8rem;
    font-size: 0.76rem;
    font-weight: 600;
    border-radius: 6px;
  }
  .btn-danger:hover { background: var(--error-bg); }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.45rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 6px;
  }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }

  .taglist-editor { margin-top: 0.35rem; }
  .taglist-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 1.6rem; }
  .taglist-empty { font-size: 0.8rem; color: var(--text-muted); font-style: italic; }
  .taglist-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: rgba(91, 156, 230, 0.14);
    border: 1px solid rgba(91, 156, 230, 0.35);
    color: var(--accent-blue);
    padding: 0.2rem 0.3rem 0.2rem 0.65rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .taglist-chip-remove {
    background: none;
    border: none;
    color: inherit;
    padding: 0;
    width: 18px;
    height: 18px;
    line-height: 1;
    border-radius: 50%;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .taglist-chip-remove:hover { background: rgba(91, 156, 230, 0.25); }
  .taglist-add-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .taglist-add-row .taglist-input { margin-top: 0; flex: 1; }
  .taglist-add-row .taglist-add-btn { flex-shrink: 0; }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }
  .filter-field { display: flex; flex-direction: column; min-width: 140px; }
  .filter-field label { margin-top: 0; margin-bottom: 0.2rem; }
  .filter-field input, .filter-field select { margin-top: 0; }
  .filter-actions { flex-direction: row; align-items: center; gap: 0.75rem; min-width: 0; }
  .filter-actions button { padding: 0.55rem 1.3rem; }
  .filter-actions a { font-size: 0.85rem; color: var(--text-muted); }
  .filter-actions a:hover { color: var(--text); }

  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.65rem 0.7rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .badge-opened_pr { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
  .badge-tests_failed { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
  .badge-error { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
  .badge-no_change_detected { background: var(--neutral-bg); color: var(--neutral-text); }
  .badge-ignored { background: var(--neutral-bg); color: var(--neutral-text); }
  .badge-running {
    background: rgba(91, 156, 230, 0.16);
    color: var(--accent-blue);
    border-color: rgba(91, 156, 230, 0.4);
    animation: pulse-running 1.6s ease-in-out infinite;
  }
  @keyframes pulse-running {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .flow {
    display: flex;
    align-items: flex-start;
    overflow-x: auto;
    padding: 0.75rem 0.25rem 0.25rem;
  }
  .flow-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    width: 118px;
    text-align: center;
  }
  .flow-node {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-weight: 700;
    font-size: 0.9rem;
  }
  .flow-step--done .flow-node { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .flow-step--active .flow-node { background: rgba(91, 156, 230, 0.18); border-color: rgba(91, 156, 230, 0.5); color: var(--accent-blue); animation: pulse-running 1.6s ease-in-out infinite; }
  .flow-step--failed .flow-node { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .flow-step--skipped .flow-node { background: var(--neutral-bg); border-color: transparent; color: var(--neutral-text); }
  .flow-pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-blue); }
  .flow-label { margin-top: 0.55rem; font-size: 0.78rem; font-weight: 600; color: var(--text); line-height: 1.3; }
  .flow-step--skipped .flow-label, .flow-step--pending .flow-label { color: var(--text-muted); font-weight: 500; }
  .flow-detail { margin-top: 0.15rem; font-size: 0.7rem; color: var(--text-muted); line-height: 1.3; word-break: break-word; }
  .flow-connector { flex: 1; height: 2px; min-width: 20px; background: var(--border); margin-top: 21px; }
  .flow-connector--done { background: var(--success-border); }

  .banner { padding: 0.8rem 1.1rem; border-radius: 10px; margin-bottom: 1.25rem; font-size: 0.88rem; border: 1px solid; line-height: 1.5; }
  .banner-ok { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .banner-error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }

  code { background: rgba(255, 255, 255, 0.08); color: #d6d9f5; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85em; }
  pre.code-block {
    background: #131421;
    color: #d6d9f5;
    border: 1px solid var(--border);
    padding: 1rem;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 0.8rem;
    line-height: 1.6;
  }

  pre.diff-view { padding: 0.75rem 0; }
  pre.diff-view span { display: block; padding: 0.05rem 1rem; white-space: pre-wrap; word-break: break-word; }
  .diff-add { background: rgba(16, 185, 129, 0.14); color: var(--success-text); }
  .diff-remove { background: rgba(229, 0, 43, 0.14); color: var(--error-text); }
  .diff-hunk { color: var(--accent-blue); opacity: 0.85; }
  .diff-meta { color: var(--text-muted); font-weight: 600; }
  .diff-context { color: var(--text-muted); }

  .engine-fields { display: none; }
  .engine-fields.active { display: block; }

  a.pr-link { color: var(--accent-blue); font-weight: 600; text-decoration: none; }
  a.pr-link:hover { text-decoration: underline; }
  a { color: var(--accent-blue); }

  details { margin-top: 0.5rem; }
  details summary {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.4rem 0;
    user-select: none;
  }
  details summary:hover { color: var(--text); }
  details[open] summary { color: var(--text); margin-bottom: 0.25rem; }
</style>
</head>
<body>
  <div class="brand">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="6" cy="16" r="2.6" fill="#e5002b"/>
      <circle cx="16" cy="16" r="2.6" fill="#e5002b"/>
      <circle cx="11" cy="6" r="2.6" fill="#e5002b"/>
      <line x1="6" y1="16" x2="11" y2="6" stroke="#e5002b" stroke-width="1.3" opacity="0.55"/>
      <line x1="16" y1="16" x2="11" y2="6" stroke="#e5002b" stroke-width="1.3" opacity="0.55"/>
      <line x1="6" y1="16" x2="16" y2="16" stroke="#e5002b" stroke-width="1.3" opacity="0.55"/>
    </svg>
    <span class="brand-name">confluence-pr-agent<span class="dim"> · spec-to-PR pipeline</span></span>
  </div>
  <nav>
    <a href="/ui/runs" class="{{ 'active' if request.url.path == '/ui/runs' else '' }}">Pipeline Runs</a>
    <a href="/ui/simulate" class="{{ 'active' if request.url.path == '/ui/simulate' else '' }}">Simulate Webhook</a>
    <a href="/ui/config" class="{{ 'active' if request.url.path == '/ui/config' else '' }}">Configuration</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
